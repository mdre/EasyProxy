// ============================================================
// build.gradle — Gradle 9.3.1 + Java 21 + Maven Central Portal
// ============================================================
import org.gradle.api.publish.maven.tasks.GenerateMavenPom

plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.37.0'
    id 'nu.studer.credentials'        version '3.0'
    id 'idea'
}

// ============================================================
// Java Toolchain
// FIX #1: withJavadocJar() y withSourcesJar() son manejados
// automáticamente por el plugin vanniktech vía configure(JavaLibrary).
// Dejarlos aquí genera duplicados y conflictos con Gradle 9.
// ============================================================
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    // NO withJavadocJar() ni withSourcesJar() — los genera vanniktech
}

idea {
    module {
        downloadJavadoc = true
    }
}

// ============================================================
// Repositorios
// ============================================================
repositories {
    mavenLocal()
    mavenCentral()
}



// ============================================================
// Dependencias
// ============================================================
dependencies {
    // You can read more about how to add dependency here:
    //   http://www.gradle.org/docs/current/userguide/dependency_management.html#sec:how_to_declare_your_dependencies
    api 'org.ow2.asm:asm:9.7'
    implementation 'org.ow2.asm:asm-util:9.7'
    // implementation 'org.burningwave:core:12.62.5'
    testImplementation "junit:junit:[4,)"
}




